aid: parallels-swsoft
name: Parallels (SWSoft)
description: >-
  Parallels is a virtualization and remote-access software company, originally
  founded as SWSoft in 1999 and renamed Parallels in 2008 (now part of
  Alludo/Corel). Its flagship enterprise product, Parallels Remote Application
  Server (RAS), delivers virtual apps and desktops and exposes a public REST API
  plus a PowerShell SDK (RASAdmin) for automating farm administration — sites,
  secure gateways, RD session hosts, cloud providers (Azure/AVD, AWS EC2,
  Hyper-V, VMware, Nutanix), publishing, policies and licensing. The RAS REST API
  is served by the customer's self-hosted RAS server (default TCP port 20443)
  and authenticated with a session token obtained via api/session/logon.
